<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhapalish (I$H) Official Fan Hub & Soundboard</title>
    <meta name="description" content="Official Jhapalish streamer fan portal. Play viral stream sound clips, listen to Sadey 3 & Wakkai Lagisakyo, and get live stream updates.">
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --accent-color: #ff3366;
            --text-color: #ffffff;
            --subtext: #a0a0b0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 10px 0 5px 0;
            font-size: 26px;
            color: var(--accent-color);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .section-title {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext);
            margin: 25px 0 12px 0;
        }

        .soundboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .sound-btn {
            background-color: var(--card-bg);
            border: 1px solid #2a2a3a;
            color: var(--text-color);
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, border-color 0.2s;
        }

        .sound-btn:active {
            transform: scale(0.96);
            border-color: var(--accent-color);
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .music-card {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a3a;
        }

        .link-btn {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #ff3366, #ff6633);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .footer {
            text-align: center;
            color: var(--subtext);
            font-size: 12px;
            margin-top: 40px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="status-badge">
            <span class="status-dot"></span> STREAM LIVE / READY
        </div>
        <h1>JHAPALISH HUB</h1>
        <p style="color: var(--subtext); font-size: 14px; margin: 0;">Official Community Portal & Soundboard</p>
    </div>

    <div class="section-title">🔊 Meme Soundboard</div>
    <div class="soundboard-grid">
        <button class="sound-btn" onclick="playSound('clip1.mp3')">🔥 "Sadey 3!"</button>
        <button class="sound-btn" onclick="playSound('clip2.mp3')">🔊 "Chakaboom"</button>
        <button class="sound-btn" onclick="playSound('clip3.mp3')">😱 "Wakkai Lagisakyo"</button>
        <button class="sound-btn" onclick="playSound('clip4.mp3')">😂 Stream React</button>
    </div>

    <div class="section-title">🎵 Discography</div>
    <div class="music-list">
        <div class="music-card">
            <span>Sadey 3 - I$H</span>
            <small style="color: var(--accent-color);">▶ Play</small>
        </div>
        <div class="music-card">
            <span>Gaidey Club</span>
            <small style="color: var(--accent-color);">▶ Play</small>
        </div>
        <div class="music-card">
            <span>Wakkai Lagisakyo</span>
            <small style="color: var(--accent-color);">▶ Play</small>
        </div>
    </div>

    <div class="section-title">🌐 Join Community</div>
    <a href="https://youtube.com/@Jhapalish" target="_blank" class="link-btn">Watch Live stream on YouTube</a>

    <div class="footer">
        Unofficial Fan Portal built for the Jhapalish Community.
    </div>
</div>

<script>
    function playSound(file) {
        // Simple Audio trigger logic
        const audio = new Audio(file);
        audio.play().catch(e => console.log('Audio file missing or touch needed'));
    }
</script>

</body>
</html>
